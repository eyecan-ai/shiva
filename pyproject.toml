[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eyecan-shiva"
dynamic = ["version"]
description = "Shiva Communication Protocol"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
keywords = []
authors = [{ name = "eyecan-ai", email = "info@eyecan.ai" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "pydantic>=2.0,<3",
  "numpy",
  "deepdiff",
  "loguru",
  "rich",
]

[project.urls]
Source = "https://github.com/eyecan-ai/shiva"
Issues = "https://github.com/eyecan-ai/shiva/issues"
Documentation = "https://github.com/eyecan-ai/shiva/blob/main/README.md"

[tool.hatch.version]
path = "shiva/__about__.py"

[project.optional-dependencies]
dev = ["pytest>=7.1.2", "pytest-asyncio>=0.21.1", "pytest-cov"]

[project.scripts]
shiva = "shiva.cli.main:cli"

[tool.hatch.build]
include = ["shiva/**/*.py"]
